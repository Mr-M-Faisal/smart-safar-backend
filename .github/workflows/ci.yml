name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --replSet rs0
          --bind_ip_all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Initialize MongoDB replica set for integration tests
        run: |
          container_id=$(docker ps --filter "ancestor=mongo:7" --format "{{.ID}}" | head -n 1)
          docker exec "$container_id" mongosh "mongodb://127.0.0.1:27017/admin" --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            docker exec "$container_id" mongosh "mongodb://127.0.0.1:27017/admin" --quiet --eval 'rs.status().ok' && break
            sleep 2
          done
      - run: npm ci
      - run: npm test
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/smart_safar_test?replicaSet=rs0
          JWT_SECRET: ci-test-secret-that-is-longer-than-thirty-two-characters
          NODE_ENV: test
